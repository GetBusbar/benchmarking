# Publish the website and its machine-readable evidence from production main.
# GitHub Actions stays retired. The schedule uses REFRESH_GATEWAY_STARS=1,
# Every night at 03:00 America/Los_Angeles; web pipelines can refresh immediately.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $VERIFY_ENGINE_REF =~ /^[0-9a-f]{40}$/'
    - if: '$CI_COMMIT_BRANCH == "dev" && $REFRESH_GATEWAY_STARS == "1" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - if: '$CI_COMMIT_BRANCH == "dev" && $VERIFY_WEBSITE_REF =~ /^[0-9a-f]{40}$/'
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
      changes: [site/**/*, engine/**/*, mock/**/*, .gitlab-ci.yml]
    - when: never

stages: [verify, publish]

verify-website:
  stage: verify
  tags: [onthebench-production]
  timeout: 30m
  image: node:22-bookworm
  rules:
    - if: '$VERIFY_WEBSITE_REF =~ /^[0-9a-f]{40}$/ || $CI_PIPELINE_SOURCE == "push"'
  variables:
    OTB_SINGLE_ENGINE: "1"
    # The dedicated website runner requires this opt-in on every job. This job
    # validates only; refresh-gateway-stars has its own pipeline-level rules.
    REFRESH_GATEWAY_STARS: "1"
  script:
    # The protected controller can check an exact release candidate without
    # publishing it or changing the main branch's human promotion policy.
    - verify_dir="$CI_BUILDS_DIR/onthebench-verify-$CI_JOB_ID"
    - trap 'rm -rf "$verify_dir"' EXIT
    - git clone --quiet "$CI_REPOSITORY_URL" "$verify_dir"
    - git -C "$verify_dir" checkout --quiet --detach "${VERIFY_WEBSITE_REF:-$CI_COMMIT_SHA}"
    - cd "$verify_dir"
    - npm ci --prefix site --ignore-scripts
    - node site/gen-data.mjs
    - node site/check-consistency.mjs site/data.json
    - node site/test-coverage.mjs
    - node site/test.mjs
    - node --max-old-space-size=2048 site/build.mjs "$verify_dir" "$verify_dir/publication"
    - OTB_TEST_ARTIFACT="$verify_dir/publication" node --test site/publishing.test.mjs site/history.test.mjs site/retention-upload.test.mjs site/run-reviews.test.mjs site/withdrawal.test.mjs

refresh-gateway-stars:
  stage: publish
  tags: [onthebench-production]
  timeout: 30m
  image: node:22-bookworm
  resource_group: onthebench-production
  rules:
    - if: '$REFRESH_GATEWAY_STARS == "1"'
  variables:
    OTB_SINGLE_ENGINE: "1"
    WRANGLER_SEND_METRICS: "false"
  script:
    # Always rebuild the currently published source branch. Scheduling from dev
    # must never publish unqualified development results or promote product code.
    - publish_dir="$CI_BUILDS_DIR/onthebench-publish-$CI_JOB_ID"
    - trap 'rm -rf "$publish_dir"' EXIT
    # Full history retains original raw bytes when a snapshot is corrected.
    - git clone --quiet --single-branch --branch main "$CI_REPOSITORY_URL" "$publish_dir"
    - cd "$publish_dir"
    # Fail the refresh on API errors; stale data must not look like a fresh run.
    - node gateways/fetch-stars.mjs
    - node site/gen-data.mjs
    - node site/check-consistency.mjs site/data.json
    - node site/test-coverage.mjs
    - node site/test.mjs
    - npm ci --prefix site --ignore-scripts
    - node --max-old-space-size=2048 site/publish.mjs

# Build the immutable instrument separately from website publication.
verify-engine:
  stage: verify
  tags: [onthebench-production]
  image: rust:1.98-bookworm
  timeout: 60m
  # The instrument is verified once, at the exact commit it is built from, on request
  # (VERIFY_ENGINE_REF). A dev push carrying that frozen engine tree does not rebuild it:
  # run-on-ec2.sh already proves the tree is byte-identical to the pinned instrument.
  rules:
    - if: '$VERIFY_ENGINE_REF =~ /^[0-9a-f]{40}$/'
  variables:
    REFRESH_GATEWAY_STARS: "1"
  script:
    - export VERIFY_ENGINE_REF="${VERIFY_ENGINE_REF:-$CI_COMMIT_SHA}"
    - git fetch origin "$VERIFY_ENGINE_REF"
    - git checkout --detach "$VERIFY_ENGINE_REF"
    - export CARGO_HOME="$CI_PROJECT_DIR/.ci-cargo" RUSTUP_HOME="$CI_PROJECT_DIR/.ci-rustup"
    - export PATH="$CARGO_HOME/bin:$PATH"
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$CI_PROJECT_DIR/rustup-init.sh"
    - sh "$CI_PROJECT_DIR/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain 1.98.0 --component rustfmt --component clippy
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    # Library qualification tests spawn the CLI; clippy does not build that executable.
    - cargo build --workspace --bins --locked
    - RUST_TEST_THREADS=1 OTB_TEST_ENGINE_BIN="$CI_PROJECT_DIR/target/debug/otb" cargo test --workspace --locked
    - rustup target add aarch64-unknown-linux-musl
    - OTB_BUILD_COMMIT="$VERIFY_ENGINE_REF" cargo build --release --locked --workspace --target aarch64-unknown-linux-musl
    - mkdir -p rig
    - cp target/aarch64-unknown-linux-musl/release/otb rig/otb-arm64
    - cp target/aarch64-unknown-linux-musl/release/mock rig/mock-arm64
    - printf '%s\n' "$VERIFY_ENGINE_REF" > rig/engine-commit
    - sha256sum rig/otb-arm64 rig/mock-arm64 > rig/SHA256SUMS
  artifacts:
    paths: [rig/]
    expire_in: 90 days
