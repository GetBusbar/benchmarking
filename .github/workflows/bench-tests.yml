# Enforced gate for the sweep engine (lib/sweep.sh) — the component that produces EVERY published
# throughput number. Runs lib/sweep_peak_test.sh on push, so a change that re-quantises fast gateways
# onto doubling rungs (the exact off-by-one class the test guards, incl. the H5 relative-TOL fix) or
# regresses the adaptive/prior-seeded path (M5) or the sweep_c1 honesty gate (M6) fails CI instead of
# shipping silently (audit H6). Fast (stubbed loadgen/rig, no network, seconds).
name: bench-tests

on:
  push:
    paths:
      - "engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "charts.py"
      - "charts_test.py"
      - "loadgen/**"
      - "mock/**"
      - ".github/workflows/bench-tests.yml"
  pull_request:
    paths:
      - "engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "charts.py"
      - "charts_test.py"
      - "loadgen/**"
      - "mock/**"
      - ".github/workflows/bench-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    # The Rust engine is replacing the shell measurement core. Its tests are the reason for the port
    # as much as its types are, so CI runs them: an untested test suite is decoration.
    #
    # The differential job is the load-bearing one. It runs the SHELL and the RUST over the same
    # generated series and requires the same answer, which is how a port is proven rather than
    # asserted. It needs bash and the shell library present, so it runs on the same checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy (denies unwrap/expect/panic outside tests)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and property tests
        run: cargo test --workspace
      # Cross-compiling to the arm64 boxes is part of the contract: the engine ships as a prebuilt
      # static binary rather than being built on a box, so a break here is a shipping break.
      - name: Cross-compile the shipped arm64 binary
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl --bin otb
          file target/aarch64-unknown-linux-musl/release/otb

  charts-and-loadgen:
    # Was "peak-search": nineteen steps gating lib/sweep.sh, stream_measure.sh, harness.sh,
    # probe_verdict.sh, mock_restart_test.sh, ingress.sh, box_qualify.sh, gateways.sh, matrix/run.sh,
    # qualify-box.sh, plateau.sh and gateway.sh's own contract - every one of those files was deleted
    # in the shell-to-Rust cutover. The job's FIRST step parse-checked lib/sweep.sh, so it failed at
    # "No such file or directory" before any later step ever ran, on every push, since the cutover.
    #
    # Two of the later steps were not dead: node site/test.mjs (already run live in cf-pages.yml, so
    # dropped here as a duplicate) and the two below, which are real code with no other CI coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # charts.py's validity gate + top-N ranking (the matrix-sole-source rewrite artifact) had ZERO
      # Python tests (MEDIUM-R3-6): check-consistency asserts site==chart by calling JS re-implementations,
      # never the real Python rules, so a regression to _proj_streaming (cpu_valid/sust_valid), _topn_keys
      # (eligibility + sort direction), _served, or the null-TTFT suppression (M3) would keep every test
      # green while the PNGs drew a bar for a row the table hides. Gate the Python rules directly. No
      # matplotlib needed (render() is not exercised).
      - name: Charts validity-gate test (streamcpu/sustained/TTFT gates + top-N ranking)
        run: python3 charts_test.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: loadgen/go.mod
      # ugen's rps/p99/delivered ARE every published board number, but had zero unit tests and CI only
      # parse-checked the sweep's CONSUMPTION of the number, never ugen's COMPUTATION (audit R3-H2).
      # Gate the numeric core: rps-over-elapsed (R2-M1), pct() + its clamp (N2), the NewRequest-error
      # path (L1), isContent's empty-placeholder handling. loadgen is a self-contained stdlib module.
      - name: loadgen vet
        run: go vet -C loadgen ./...
      - name: loadgen unit tests (rps/pct/isContent/buildRequest)
        run: go test -C loadgen ./...

  mock-shape:
    # The mock must never bottleneck and must serve every dialect identically; its per-dialect
    # request_shape_ok is what the matrix's leg-3 body_ok trusts. Gate it so the bedrock/cohere
    # tightening (R3-M6 — reject an unconverted OpenAI body) can never silently regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: mock unit tests (request_shape_ok per dialect + routing)
        run: cargo test --manifest-path mock/Cargo.toml --tests
