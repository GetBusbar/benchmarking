# Enforced gate for the sweep engine (lib/sweep.sh) — the component that produces EVERY published
# throughput number. Runs lib/sweep_peak_test.sh on push, so a change that re-quantises fast gateways
# onto doubling rungs (the exact off-by-one class the test guards, incl. the H5 relative-TOL fix) or
# regresses the adaptive/prior-seeded path (M5) or the sweep_c1 honesty gate (M6) fails CI instead of
# shipping silently (audit H6). Fast (stubbed loadgen/rig, no network, seconds).
name: bench-tests

on:
  push:
    paths:
      - "lib/sweep.sh"
      - "lib/sweep_peak_test.sh"
      - "lib/stream_measure.sh"
      - "lib/stream_measure_test.sh"
      - "lib/harness.sh"
      - "lib/mem_rss_test.sh"
      - "lib/probe_verdict.sh"
      - "lib/probe_verdict_test.sh"
      - "gateways/*/gateway.sh"
      - "lib/mock_restart_test.sh"
      - "lib/ingress.sh"
      - "lib/ingress_path_test.sh"
      - "lib/box_qualify.sh"
      - "lib/box_qualify_test.sh"
      - "lib/gateways.sh"
      - "lib/gateway_isolation_test.sh"
      - "lib/rig.sh"
      - "matrix/qualify-box.sh"
      - "matrix/run.sh"
      - "lib/promote_guard.py"
      - "lib/promote_guard_test.py"
      - "charts.py"
      - "charts_test.py"
      - "loadgen/**"
      - "mock/**"
      - ".github/workflows/bench-tests.yml"
  pull_request:
    paths:
      - "lib/sweep.sh"
      - "lib/sweep_peak_test.sh"
      - "lib/stream_measure.sh"
      - "lib/stream_measure_test.sh"
      - "lib/harness.sh"
      - "lib/mem_rss_test.sh"
      - "lib/probe_verdict.sh"
      - "lib/probe_verdict_test.sh"
      - "gateways/*/gateway.sh"
      - "lib/mock_restart_test.sh"
      - "lib/ingress.sh"
      - "lib/ingress_path_test.sh"
      - "lib/box_qualify.sh"
      - "lib/box_qualify_test.sh"
      - "lib/gateways.sh"
      - "lib/gateway_isolation_test.sh"
      - "lib/rig.sh"
      - "matrix/qualify-box.sh"
      - "matrix/run.sh"
      - "lib/promote_guard.py"
      - "lib/promote_guard_test.py"
      - "charts.py"
      - "charts_test.py"
      - "loadgen/**"
      - "mock/**"
      - ".github/workflows/bench-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peak-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check the sweep + stream-measure shell files
        run: bash -n lib/sweep.sh && bash -n lib/sweep_peak_test.sh && bash -n lib/stream_measure.sh && bash -n lib/stream_measure_test.sh
      - name: Peak-search regression test (H5) + adaptive/prior (M5) + sweep_c1 (M6)
        run: bash lib/sweep_peak_test.sh
      # lib/harness.sh's RSS readers feed EVERY published idle/peak/recovered/hwm number. They used to
      # return a literal 0 when /proc or `docker inspect` was unreadable, and the memory lanes' guards
      # did not treat 0 as unmeasured — so a rig-side MEASUREMENT FAILURE was published as a certified
      # 0.0 MiB and won first place on the ascending memory ranking (audit P0-2). Gate the
      # unmeasurable-prints-nothing contract and the single mem_num_or_null guard directly.
      # Same file also gates MANIFEST PARITY: gw_rss and gw_hwm must read the SAME process set for
      # every one of the 13 gateways (three native manifests read a single pid for rss and the whole
      # tree for hwm, publishing two different populations of the same gateway side by side).
      - name: RSS measurement-failure + manifest-parity test (null-never-0; gw_rss/gw_hwm same process set)
        run: bash -n lib/harness.sh && bash -n lib/mem_rss_test.sh && bash lib/mem_rss_test.sh && for m in gateways/*/gateway.sh; do bash -n "$m" || exit 1; done
      # lib/probe_verdict.sh is the ONE choke point deciding how long a persistently-000/5xx cell is
      # retried and what verdict is published for it. run_cell used to branch BOTH on the gateway's own
      # advisory capability declaration: the same observation (persistent 5xx, mock verifiably healthy)
      # was published not_configured when undeclared and not_verified when declared, and the declared
      # cell also got 3x120s of retries against the undeclared cell's 2x10s. A gateway's unverified
      # claim therefore moved both the published verdict and the effort spent measuring it. Gate the
      # observation-only contract and the single uniform budget so the branch cannot come back.
      - name: Probe-verdict choke-point test (verdict + retry budget from observables only, one budget for all cells)
        run: bash -n lib/probe_verdict.sh && bash -n lib/probe_verdict_test.sh && bash lib/probe_verdict_test.sh
      # lib/stream_measure.sh produces EVERY published streams_sustained / cpu_fps / added-TTFT number but
      # had ZERO CI coverage (MEDIUM-R2-4): the sustained/cpu-fps bisect+peak searches, the sustained
      # SM_MOCK_BOUND decision (the MEDIUM-R2-2 gate's source signal), stream_c1's added-latency honesty
      # gate, and the dead-mock stream_mock_ready path. Gate it so a sign inversion / inverted mock-bound
      # comparison / false-over-a-dead-reference can never ship silently.
      - name: Stream-measure regression test (sustained/cpu-fps search + mock-bound + stream_c1 + dead-mock)
        run: bash lib/stream_measure_test.sh
      # The mock-restart choke point (audit #21). Four sites pkill'd the mock and relaunched after a
      # blind `sleep 1`; pkill returns before the target exits, so the fresh mock regularly panicked on
      # EADDRINUSE and the harness recorded the cell "untestable / stream_mock_unready" — 48 of 75
      # served cells in the 2026-07-25 field run, which emptied the matrix streaming lane for ALL 13
      # gateways. Gate the wait-for-exit behaviour so the blind sleep can never come back.
      - name: Mock-restart choke-point test (wait for exit + port release, SIGKILL escalation, budget)
        run: bash -n lib/mock_restart_test.sh && bash lib/mock_restart_test.sh
      # lib/ingress.sh is the ONE choke point deciding which URL each ingress dialect is probed on.
      # matrix/run.sh used to freeze those paths at script init, so the two dialects that carry the
      # model in the URL PATH (gemini, bedrock) kept requesting the model from BEFORE gw_matrix_egress
      # switched GW_MODEL for the column — making {gemini,bedrock} x {every non-openai egress}
      # impossible to pass and publishing 10+ cells as red gateway failures. Gate the late-binding
      # contract (and that a manifest's GW_MATRIX_PATH_* override still wins) so it cannot re-freeze.
      - name: Ingress-path choke-point test (late-bound GW_MODEL in gemini/bedrock paths + override precedence)
        run: bash -n lib/ingress.sh && bash -n lib/ingress_path_test.sh && bash -n matrix/run.sh && bash lib/ingress_path_test.sh
      # lib/box_qualify.sh decides whether a freshly launched bench box is sound ENOUGH to spend a
      # multi-hour 6x6 on. It exists because on 2026-07-25 a contaminated box ran to completion and its
      # numbers were published as a gateway regression: that box's no-gateway floor sat INSIDE the
      # healthy population's absolute range (77-81us vs 73-82us), so no static threshold caught it —
      # only the drift against its OWN prior runs (+5.4% vs a healthy -2.6%..+3.8%) and its 86% peak
      # collapse did. Gate both bands against the REAL measured numbers so a change that re-loosens the
      # drift check, drops the jitter signal, blocks a first run for lack of history, or lets a FAILED
      # qualification seed the next run's baseline fails CI instead of shipping.
      - name: Box-qualification test (floor drift + jitter + anti-ratchet + peak replay + baseline hygiene)
        run: bash -n lib/box_qualify.sh && bash -n lib/box_qualify_test.sh && bash -n matrix/qualify-box.sh && bash -n lib/rig.sh && bash lib/box_qualify_test.sh
      # THE STRUCTURAL INVARIANT: "adding a gateway is exactly, drop in gateways/<name>/gateway.sh".
      # It was not true. bench-status.sh iterated a frozen 13-name string; five runners defaulted
      # GATEWAY to one specific name; verify-local.sh tore down a hardcoded container name, so it
      # killed the wrong container whenever it was handed any other gateway; gateways/versions.env
      # held every gateway's pinned ref, so a source-built entrant needed a block in a file it did
      # not own; and lib/box_qualify_test.sh asserted "gomodel fails" about what is really a
      # hardware gate. lib/gateways.sh is now the one shell-side discovery choke point and this lint
      # enforces the invariant as a class: it enumerates gateways/*/ AT RUNTIME (never a hardcoded
      # roster of its own) and fails if any gateway's name or declared alias appears in the CODE of
      # a file outside its own directory, or if any single line enumerates three or more of them.
      # It self-tests first, so a scanner that silently matched nothing aborts instead of reporting
      # a green tree.
      - name: Gateway-isolation lint (a gateway is named only inside its own directory; no frozen rosters)
        run: bash -n lib/gateways.sh && bash -n lib/gateway_isolation_test.sh && bash -n bench-status.sh && bash -n verify-local.sh && bash lib/gateway_isolation_test.sh
      # lib/promote_guard.py decides whether an incoming result may overwrite the committed one; a bug
      # there republishes a regression as an honest failure (R4-M2). Covers MEDIUM-R2-3 (matrix all-dead
      # 000 detection) + the anchored-marker / status-000 / honest-not-served behaviours.
      - name: Promote-guard regression test (matrix all-dead 000/5xx-warm + anchored marker + honest not-served)
        run: python3 lib/promote_guard_test.py
      # charts.py's validity gate + top-N ranking (the matrix-sole-source rewrite artifact) had ZERO
      # Python tests (MEDIUM-R3-6): check-consistency asserts site==chart by calling JS re-implementations,
      # never the real Python rules, so a regression to _proj_streaming (cpu_valid/sust_valid), _topn_keys
      # (eligibility + sort direction), _served, or the null-TTFT suppression (M3) would keep every test
      # green while the PNGs drew a bar for a row the table hides. Gate the Python rules directly. No
      # matplotlib needed (render() is not exercised).
      - name: Charts validity-gate test (streamcpu/sustained/TTFT gates + top-N ranking)
        run: python3 charts_test.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: loadgen/go.mod
      # ugen's rps/p99/delivered ARE every published board number, but had zero unit tests and CI only
      # parse-checked the sweep's CONSUMPTION of the number, never ugen's COMPUTATION (audit R3-H2).
      # Gate the numeric core: rps-over-elapsed (R2-M1), pct() + its clamp (N2), the NewRequest-error
      # path (L1), isContent's empty-placeholder handling. loadgen is a self-contained stdlib module.
      - name: loadgen vet
        run: go vet -C loadgen ./...
      - name: loadgen unit tests (rps/pct/isContent/buildRequest)
        run: go test -C loadgen ./...

  mock-shape:
    # The mock must never bottleneck and must serve every dialect identically; its per-dialect
    # request_shape_ok is what the matrix's leg-3 body_ok trusts. Gate it so the bedrock/cohere
    # tightening (R3-M6 — reject an unconverted OpenAI body) can never silently regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: mock unit tests (request_shape_ok per dialect + routing)
        run: cargo test --manifest-path mock/Cargo.toml --tests
