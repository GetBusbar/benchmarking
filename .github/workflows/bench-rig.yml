name: bench-rig

# Build the bench "rig" - the engine (Rust) and the mock (Rust) - for BOTH arches natively, and
# publish them to the rolling `rig` release. The bench boxes then just `curl` the right binary
# (lib/rig.sh), so they need no build toolchain: bare OS + docker is enough. Runs on any change to
# the mock sources, and on demand.
on:
  push:
    branches: [main]
    paths: ["mock/**", "engine/**", ".github/workflows/bench-rig.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to upload release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Install Rust via the pinned action rather than piping sh.rustup.rs into a shell. This job holds
      # contents:write + GH_TOKEN and publishes the otb/mock binaries every bench box downloads as the
      # frozen instrument; the build-commit self-check below runs AFTER the toolchain install and cannot
      # catch a compromised toolchain that still compiles the correct source. dtolnay/rust-toolchain is
      # the same install path bench-tests.yml already trusts.
      - uses: dtolnay/rust-toolchain@stable

      - name: Build mock (Rust, native ${{ matrix.arch }})
        run: |
          # The mock is a WORKSPACE MEMBER, so its binary lands in the workspace target dir, not in
          # mock/target. It moved there when the engine joined the workspace, and the copy kept
          # looking where it used to be - the build succeeded and the step failed on the copy.
          cargo build --release --manifest-path mock/Cargo.toml
          cp target/release/mock "mock-${{ matrix.arch }}"

      - name: Build the engine (Rust, native ${{ matrix.arch }})
        env:
          # THE BINARY CARRIES THE COMMIT IT WAS BUILT FROM, so a bench box can ask it rather than
          # trust the label the orchestrator passes. The boxes DOWNLOAD this artifact; without this
          # the only record of which engine measured a board was an env var set from someone else's
          # checkout - and on 2026-08-03 that stamped a snapshot 0ce7a907 while the binary was the
          # previous release, because the fixes were on a branch and this workflow only rebuilds on
          # a push to main. run-on-ec2.sh now refuses to measure when the two disagree.
          OTB_BUILD_COMMIT: ${{ github.sha }}
        run: |
          # Native, on a runner of the target arch, for the same reason the mock is: a bench box
          # then needs no toolchain, which is what keeps every box identical.
          cargo build --release --bin otb
          cp target/release/otb "otb-${{ matrix.arch }}"
          # The artifact must be able to answer for itself before it is published.
          built_from="$(./otb-${{ matrix.arch }} engine-commit 2>/dev/null || true)"
          if [ "$built_from" != "${{ github.sha }}" ]; then
            echo "refusing to publish: otb reports '$built_from', expected '${{ github.sha }}'" >&2
            exit 1
          fi
          echo "otb-${{ matrix.arch }} reports its build commit: $built_from"

      - name: Publish to the rolling `rig` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rig >/dev/null 2>&1 || \
            gh release create rig --title "bench-rig binaries (rolling latest)" \
              --notes "Prebuilt mock + engine for the bench boxes. Rebuilt by bench-rig.yml."
          gh release upload rig --clobber "mock-${{ matrix.arch }}" "otb-${{ matrix.arch }}"
