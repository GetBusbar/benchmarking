# Weekly refresh of the committed GitHub star snapshot (gateways/stars.json).
#
# The Gateways overview shows a star count per gateway, sourced from the committed
# snapshot gateways/stars.json (see gateways/fetch-stars.mjs). cf-pages.yml also
# refreshes stars live at build time, so the DEPLOYED board is already exact on every
# deploy - but the committed snapshot (the fallback used when the GitHub API is
# rate-limited at build) only moves when someone runs the script and commits.
#
# This job keeps that snapshot current on its own cadence: run fetch-stars.mjs weekly,
# and commit stars.json only if it changed. The resulting gateways/** push trips
# cf-pages.yml, so the live board redeploys too. On an API failure the script throws
# BEFORE writing, leaving the last-good snapshot in place and this job commits nothing.
name: stars

on:
  schedule:
    # Mondays 06:00 UTC. Cron on GitHub Actions is best-effort, not exact-to-the-minute.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh star snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node gateways/fetch-stars.mjs
      - name: Commit if the snapshot changed
        run: |
          if git diff --quiet -- gateways/stars.json; then
            echo "stars.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateways/stars.json
          git commit -m "results: refresh gateway star snapshot (weekly)"
          git push
