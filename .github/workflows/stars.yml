# Weekly refresh of the gateway star counts shown on onthebench.ai/gateways.
#
# The Gateways overview's star count is refreshed LIVE AT BUILD TIME by cf-pages.yml
# (it runs gateways/fetch-stars.mjs before generating the bundle; the committed
# gateways/stars.json is only the rate-limited fallback). So the deployed board is
# exact on every deploy - but the site only deploys when results/**, gateways/** or
# site/** changes on main. If no results land for a while, the live star counts sit
# still.
#
# This job closes that gap without touching git: once a week it dispatches cf-pages,
# which redeploys the site and re-fetches the stars live. No commit, so it does not
# collide with main's branch protection (which requires PRs).
name: stars

on:
  schedule:
    # Mondays 06:00 UTC. Cron on GitHub Actions is best-effort, not exact-to-the-minute.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger a site redeploy (refreshes stars live at build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cf-pages.yml --ref main
