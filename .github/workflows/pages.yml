# Build and deploy the results site to GitHub Pages.
# gen-data.mjs scans gateways/*/definition.json + results/**/*.json and emits site/data.json; the
# finished site/ directory is the Pages artifact.
#
# SUPERSEDED BY cf-pages.yml (onthebench.ai) and kept only until the cutover is confirmed - but while
# it is live it publishes the same board, so it runs the SAME policy and gates as cf-pages: the
# single-engine n/a policy, the C1-C5 structural lints on the bundle it uploads, and both site suites.
# A board cf-pages would refuse must not reach the second URL.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "gateways/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OTB_SINGLE_ENGINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate site data
        run: node site/gen-data.mjs
      - name: Structural invariants C1-C5 on the bundle being deployed
        run: node site/check-consistency.mjs site/data.json
      - name: Site coverage siblings (URL codec fixed points, one envelope one story)
        run: node site/test-coverage.mjs
      - name: Consistency guard (table == drawer == compare == charts)
        run: node site/test.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4
