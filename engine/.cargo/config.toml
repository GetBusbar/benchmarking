# Cross-compiling to the arm64 Linux boxes from a mac. Apple's ld rejects GNU linker flags, so use
# rust-lld, which ships with the toolchain: no brew, no docker, no per-machine setup. musl is chosen
# over gnu deliberately: the binary is statically linked, so it cannot pick up a glibc version
# coupling between whatever built it and whatever Ubuntu the box happens to boot.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-gnu]
linker = "rust-lld"
