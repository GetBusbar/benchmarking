# Codecov is INFORMATIONAL here, never a gate. The correctness gate is bench-tests.yml's
# `engine`/`audit`/`site` jobs; coverage is an observation surfaced on the README badge and as
# per-PR context. So:
#   * status.*.informational: true  → Codecov posts a check for visibility but it is NEVER "failing",
#     so it can never block a PR or turn a branch red over a coverage delta.
#   * comment: false                → no bot comments on PRs; the signal lives on the badge + the
#     Codecov UI, keeping PRs seamless.
#   * ignore                        → the coverage job only measures the Rust workspace (engine +
#     mock), so exclude the Python auditors, the JS/site bundle, docs, results/fixtures and every
#     Rust test module, so the reported percentage reflects the shipped product code.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "site"
  - "docs"
  - "assets"
  - "history"
  - "results"
  - "gateways"
  - "lib"
  - "**/*.py"
  - "**/tests/**"
  - "**/*_test.rs"
