[package]
name = "mock-upstream"
version = "0.1.0"
edition = "2021"
description = "Deterministic, blazing-fast mock upstream for the gateway benchmark. Answers any path with a fixed small JSON body (OpenAI shape, or Anthropic shape for /messages) so the measured number is the gateway's cost, never the upstream's. Built to sustain 100s of thousands of RPS so it is never the bottleneck."

[[bin]]
name = "mock"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
tokio-stream = { version = "0.1", default-features = false }
# Structural request validation (the Bedrock Converse shape check) runs only while correctness
# recording is enabled, never on the unrecorded load path. The tests also use it to parse the
# hand-assembled state document.
serde_json = "1"
# HTTPS ON THE MOCK (v1.2, only when started with --tls-port): TLS 1.3 via rustls on the ring
# provider, and the run's CA plus per-SNI leaves via rcgen. No default features, so no aws-lc and no
# TLS 1.2.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

# TESTS ONLY (feature merge into the tokio dep above). The body-cap test drives handle() over a real
# loopback connection and needs the raw read/write helpers to write the request and read the
# response; the shipped binary never calls them.
[dev-dependencies.tokio]
version = "1"
features = ["io-util"]

