[package]
name = "mock-upstream"
version = "0.1.0"
edition = "2021"
description = "Deterministic, blazing-fast mock upstream for the gateway benchmark. Answers each of six wire protocols by request path (OpenAI chat, OpenAI Responses, Anthropic, Gemini, Bedrock Converse, Cohere) with a fixed small body, streams SSE for OpenAI/Anthropic on stream:true, and exposes a recording control plane, so the measured number is the gateway's cost, never the upstream's. Built to sustain 100s of thousands of RPS so it is never the bottleneck."

[[bin]]
name = "mock"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
tokio-stream = { version = "0.1", default-features = false }

# Structural protocol validation runs only while correctness recording is enabled.
serde_json = "1"

# TESTS ONLY (feature merge into the tokio dep above). The body-cap test drives handle() over a real
# loopback connection and needs the raw read/write helpers to write the request and read the
# response; the shipped binary never calls them.
[dev-dependencies.tokio]
version = "1"
features = ["io-util"]

